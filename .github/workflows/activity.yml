name: Refresh activity

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/activity.mjs", "scripts/lib.mjs", ".github/workflows/activity.yml"]

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build activity.svg
        run: node scripts/activity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/activity.svg; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git commit -m "chore: refresh activity"
          git push
